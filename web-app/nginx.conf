server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routes (/home, /gallery, /editor, /presets, ...) are served by
  # the SPA, so anything that is not a real file falls back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|jpe?g|svg|wasm|task)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
